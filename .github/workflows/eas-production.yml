name: EAS Production Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || 'RUXE4fjUnh0qhBwgIFdBimt3qCObnaBcxR5VJNFz' }}
  SKIP_SUBMIT: ${{ secrets.SKIP_SUBMIT || 'true' }}

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v3

      - name: 🔧 Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📥 Install dependencies
        run: npm install

      - name: 🚀 Install EAS CLI
        run: npm install -g eas-cli

      - name: 🔁 Bump version
        run: npm run version:bump

      - name: 🏗️ Build for production
        run: eas build --platform all --profile production --non-interactive

      - name: 🚚 Submit to Stores (optional)
        if: env.SKIP_SUBMIT != 'true'
        run: |
          eas submit --platform android --profile production --non-interactive
          eas submit --platform ios --profile production --non-interactive